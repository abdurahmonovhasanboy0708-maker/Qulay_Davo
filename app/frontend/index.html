<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qulay Davo: navbat olish</title>
<style>
:root{--ink:#16313a;--mut:#62808a;--acc:#0d9488;--acc2:#0f766e;--line:#d9e8e6;--bad:#dc2626;--ok:#15803d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(160deg,#e4f6f1,#edf2ff 55%,#fdf0f5) fixed}
body::before,body::after{content:"";position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.55}
body::before{width:440px;height:440px;background:#5eead4;top:-140px;left:-120px}
body::after{width:400px;height:400px;background:#a5b4fc;bottom:-140px;right:-100px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0 0 .3em}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;max-width:1000px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font:700 1.35rem Georgia,serif;color:var(--acc2)}
.logo i{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#14b8a6,#0f766e);color:#fff;display:grid;place-items:center;font:700 1.4rem system-ui;font-style:normal}
#who{display:flex;gap:12px;align-items:center}
main{max-width:1000px;margin:0 auto;padding:6px 22px 60px}
.card{background:rgba(255,255,255,.88);backdrop-filter:blur(8px);border:1px solid #fff;border-radius:22px;padding:22px;box-shadow:0 8px 30px rgba(15,118,110,.08);margin-bottom:16px}
.muted{color:var(--mut)}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:14px;padding:11px 20px;background:var(--acc);color:#fff;transition:.15s}
button:hover{background:var(--acc2);transform:translateY(-1px)}
button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.ghost:hover{background:#f1f8f7}
button:focus-visible,input:focus-visible{outline:3px solid #5eead4;outline-offset:2px}
input{font:inherit;width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
label{display:block;margin-bottom:14px;font-weight:600;font-size:.92rem}label input{margin-top:6px;font-weight:400}
.auth{max-width:430px;margin:36px auto}.auth h1{font-size:2rem}
.seg{display:inline-flex;background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:16px;padding:5px;gap:4px;margin-bottom:20px}
.seg button{background:transparent;color:var(--mut);padding:9px 18px}.seg button.on{background:var(--acc);color:#fff}
.hello{margin:6px 0 20px}.hello h1{font-size:2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.grid .card{margin:0}
.av{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;color:#fff;font:700 1.3rem Georgia,serif;margin-bottom:12px}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;background:#e6f5f2;color:var(--acc2);font-size:.85rem;font-weight:600}
.days{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px}
.day{min-width:68px;padding:10px 6px;background:#fff;color:var(--ink);border:1.5px solid var(--line);text-align:center;line-height:1.25}
.day b{display:block;font-size:1.3rem}.day.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.part{font-weight:700;margin:14px 0 8px;color:var(--mut)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.slots button{background:#fff;color:var(--acc2);border:1.5px solid #99d9d0;padding:10px 0}.slots button:hover{background:var(--acc);color:#fff}
.ap{display:flex;gap:18px;align-items:center}
.date{min-width:74px;text-align:center;border-radius:18px;padding:10px 6px;background:linear-gradient(160deg,#14b8a6,#0f766e);color:#fff;line-height:1.2}
.date b{display:block;font:700 1.9rem Georgia,serif}.date.x{background:#cbd5d4}
.ap .in{flex:1}.ap h3{margin:0}
.bd{display:inline-block;padding:3px 12px;border-radius:99px;font-size:.82rem;font-weight:700;background:#dcfce7;color:var(--ok)}
.bd.cancelled,.bd.no_show{background:#fee2e2;color:var(--bad)}.bd.done{background:#e0e7ff;color:#4338ca}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.ov{position:fixed;inset:0;background:rgba(15,40,45,.45);display:grid;place-items:center;padding:16px;z-index:9;backdrop-filter:blur(3px)}
.md{background:#fff;border-radius:24px;padding:26px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.md .btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#134e4a;color:#fff;padding:13px 22px;border-radius:16px;transition:transform .25s;max-width:90%;z-index:10}
#toast.show{transform:translateX(-50%)}#toast.bad{background:var(--bad)}
@media(max-width:560px){.ap{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="logo"><i>+</i>Qulay Davo</div><div id="who"></div></header>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),A=$('#app'),TZ='Asia/Tashkent';
let token=localStorage.getItem('qd_t'),me=null,D={},selDay=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=s=>new Date(s).toLocaleDateString('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',year:'numeric'});
const hm=s=>new Date(s).toLocaleTimeString('ru-RU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
const iso=d=>d.toLocaleDateString('sv',{timeZone:TZ});
const MON=['yan','fev','mar','apr','may','iyun','iyul','avg','sen','okt','noy','dek'],WD=['Yak','Dush','Sesh','Chor','Pay','Juma','Shan'];
const ST={booked:'Faol',cancelled:'Bekor qilingan',done:'Kelgan',no_show:'Kelmagan'};
const COL=['#14b8a6','#6366f1','#f59e0b','#ec4899','#0ea5e9','#22c55e'];

function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3500)}
async function api(p,o={}){
  const h={};if(token)h.Authorization='Bearer '+token;
  if(o.json){h['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
  const r=await fetch(p,{method:o.method||'GET',headers:h,body:o.body});
  const d=await r.json().catch(()=>null);
  if(r.status===401&&token){logout();throw new Error('Qaytadan kiring')}
  if(!r.ok){let m=d&&d.detail;if(Array.isArray(m))m=m.map(e=>e.msg).join(', ');throw new Error(m||'Xatolik yuz berdi')}
  return d}
const run=f=>async(...a)=>{try{await f(...a)}catch(e){toast(e.message,1)}};
const ask=(title,body,ok='Tasdiqlash')=>new Promise(r=>{const m=document.createElement('div');m.className='ov';
  m.innerHTML=`<div class="md" role="dialog"><h3>${title}</h3><p>${body}</p><div class="btns"><button class="ghost" data-v="0">Orqaga</button><button data-v="1">${ok}</button></div></div>`;
  m.onclick=e=>{const v=e.target.dataset.v;if(v!==undefined||e.target===m){m.remove();r(v==='1')}};document.body.append(m)});

function logout(){token=null;me=null;localStorage.removeItem('qd_t');$('#who').innerHTML='';authView()}
function authView(mode='login'){
  A.innerHTML=`<section class="card auth"><h1>Xush kelibsiz!</h1><p class="muted">Klinikaga oson va tez navbat oling.</p>
  <div class="seg"><button class="${mode=='login'?'on':''}" onclick="authView('login')">Kirish</button><button class="${mode=='reg'?'on':''}" onclick="authView('reg')">Ro'yxatdan o'tish</button></div>
  <form onsubmit="auth(event,'${mode}')">
  ${mode=='reg'?'<label>Ism-familiya<input name="full_name" required minlength="2" autocomplete="name"></label>':''}
  <label>Telefon raqam<input name="phone" placeholder="+998 90 123 45 67" required autocomplete="tel"></label>
  <label>Parol<input name="password" type="password" required minlength="6" autocomplete="${mode=='login'?'current-password':'new-password'}"></label>
  <button style="width:100%">${mode=='login'?'Kirish':"Ro'yxatdan o'tish"}</button></form></section>`}
const auth=run(async(e,mode)=>{
  e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  if(mode=='reg')await api('/auth/register',{method:'POST',json:f});
  const r=await api('/auth/login',{method:'POST',body:new URLSearchParams({username:f.phone,password:f.password})});
  token=r.access_token;localStorage.setItem('qd_t',token);await start()});

async function start(){
  try{me=await api('/auth/me')}catch(e){return authView()}
  if(me.role!='patient'){location.replace('crm.html');return}
  $('#who').innerHTML=`<span class="muted">${esc(me.full_name)}</span><button class="ghost" onclick="logout()">Chiqish</button>`;
  A.innerHTML=`<div class="hello"><h1>Salom, ${esc(me.full_name.split(' ')[0])}!</h1><p class="muted">Qaysi shifokorga yozilamiz?</p></div>
  <div class="seg"><button data-k="doctors" onclick="tab('doctors')">Shifokorlar</button><button data-k="my" onclick="tab('my')">Mening navbatlarim</button></div><div id="content"></div>`;
  tab('doctors')}
const tab=run(async k=>{document.querySelectorAll('.seg [data-k]').forEach(b=>b.classList.toggle('on',b.dataset.k==k));await(k=='my'?showMy:showDoctors)()});

async function showDoctors(){
  const ds=await api('/doctors?limit=100');D={};ds.forEach(d=>D[d.id]=d);
  $('#content').innerHTML=(ds.length?`<div class="grid">${ds.map(d=>`<div class="card"><div class="av" style="background:${COL[d.id%COL.length]}">${esc(d.full_name.replace(/^Dr\.?\s*/i,'')[0])}</div><h3>${esc(d.full_name)}</h3><p class="muted" style="margin:0 0 10px">${esc(d.specialty)}</p>${d.cabinet_name?`<span class="chip">${esc(d.cabinet_name)}</span>`:''}<p style="margin:14px 0 0"><button onclick="pick(${d.id})">Navbat olish</button></p></div>`).join('')}</div>`:'<p class="empty">Hozircha shifokorlar yo\'q.</p>')+'<div id="picker"></div>'}
function pick(id){
  const base=Date.now();selDay=iso(new Date(base+864e5));
  const chips=[1,2,3,4,5,6,7].map(i=>{const d=iso(new Date(base+i*864e5)),w=new Date(d+'T12:00:00');
    return `<button class="day ghost${d==selDay?' on':''}" data-d="${d}" onclick="setDay(${id},'${d}')">${WD[w.getDay()]}<b>${+d.slice(8)}</b>${MON[+d.slice(5,7)-1]}</button>`}).join('');
  $('#picker').innerHTML=`<div class="card" style="margin-top:16px"><h2>${esc(D[id].full_name)}</h2><p class="muted">1. Kunni tanlang, 2. qulay vaqtni bosing</p><div class="days">${chips}</div><div id="slots"></div></div>`;
  loadSlots(id);$('#picker').scrollIntoView({behavior:'smooth'})}
function setDay(id,d){selDay=d;document.querySelectorAll('.day').forEach(b=>b.classList.toggle('on',b.dataset.d==d));loadSlots(id)}
const loadSlots=run(async id=>{
  const r=await api(`/doctors/${id}/slots?date=${selDay}`);
  const part=(t,l)=>l.length?`<div class="part">${t}</div><div class="slots">${l.map(s=>`<button onclick="book(${id},'${s.start_at}')">${hm(s.start_at)}</button>`).join('')}</div>`:'';
  const am=r.slots.filter(s=>+hm(s.start_at).slice(0,2)<13),pm=r.slots.filter(s=>+hm(s.start_at).slice(0,2)>=13);
  $('#slots').innerHTML=r.slots.length?part('Ertalab',am)+part('Tushdan keyin',pm):'<p class="empty">Bu kunda bo\'sh vaqt yo\'q. Boshqa kunni tanlang.</p>'});
const book=run(async(id,sa)=>{
  if(!await ask('Navbatni tasdiqlaysizmi?',`<b>${esc(D[id].full_name)}</b><br>${esc(D[id].specialty)}<br>${dmy(sa)}, soat <b>${hm(sa)}</b>`))return;
  await api('/appointments',{method:'POST',json:{doctor_id:id,start_at:sa}});
  toast('Navbat band qilindi ✓ Eslatma Telegramga keladi');loadSlots(id)});

async function showMy(){
  const l=await api('/appointments/my');
  $('#content').innerHTML=l.length?l.map(a=>{const d=new Date(a.start_at),n=+iso(d).slice(8),m=MON[+iso(d).slice(5,7)-1];
    return `<div class="card ap"><div class="date${a.status=='booked'?'':' x'}"><b>${n}</b>${m}</div><div class="in"><h3>${esc(a.doctor_name)}</h3><p class="muted" style="margin:2px 0">${esc(a.specialty)}${a.cabinet_name?', '+esc(a.cabinet_name):''}</p><p style="margin:4px 0"><b>${hm(a.start_at)}</b> <span class="bd ${a.status}">${ST[a.status]}</span></p></div>${a.status=='booked'?`<button class="ghost" onclick="cancel(${a.id})">Bekor qilish</button>`:''}</div>`}).join(''):'<p class="empty">Hali navbatingiz yo\'q.<br>"Shifokorlar" bo\'limidan qulay vaqtni tanlang.</p>'}
const cancel=run(async id=>{
  if(!await ask('Navbat bekor qilinsinmi?','Bu vaqt boshqa bemorlar uchun bo\'shaydi.','Ha, bekor qilish'))return;
  await api(`/appointments/${id}/cancel`,{method:'PATCH'});toast('Navbat bekor qilindi');showMy()});

token?start():authView();
</script>
</body>
</html>
